name: Quick Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: quick-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-build:
    name: Quick checks (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The runtime tolerates missing build metadata (and the test suite must,
      # since tests run before the build), so only this check can catch a
      # package that would ship unable to identify itself.
      - name: Verify packaged build metadata
        run: npm run verify:package
